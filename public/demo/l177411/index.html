<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mut:#5b6675;--line:#dde1e7;--acc:#0b6b3a;--c1:#0b6b3a;--c2:#c8202f;--c3:#1b5fa8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.25rem}
header small{display:block;opacity:.85}
.lang button{border:1px solid #fff;background:transparent;color:#fff;padding:6px 14px;cursor:pointer;font-weight:600}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0}
.lang button.on{background:#fff;color:var(--acc)}
main{max-width:1280px;margin:0 auto;padding:16px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:3px}
select,input[type=search]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.count{font-weight:700;font-size:1.05rem}
button.reset{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font:inherit}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
#map{height:520px;border-radius:8px}
.list{max-height:520px;overflow:auto;margin:0;padding:0;list-style:none}
.list li{padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:hover{background:#eef5f0}
.list b{display:block}.list span{color:var(--mut);font-size:.85rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.charts h2{font-size:.95rem;margin:0 0 8px}
.chartbox{position:relative;height:260px}
.ex{display:inline-block;background:#fff3cd;color:#7a5b00;border:1px solid #ecd27a;border-radius:4px;font-size:.72rem;padding:1px 6px;margin-left:6px}
footer{text-align:center;color:var(--mut);padding:20px 16px;font-size:.85rem}
@media(max-width:860px){.grid{grid-template-columns:1fr}#map{height:380px}.list{max-height:300px}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const I={
 es:{title:'Mapa de Lectura Pública',sub:'Red de Lectura Pública de Euskadi (RLPE) · L-177411',territory:'Territorio',municipality:'Municipio',search:'Buscar biblioteca',reset:'Restablecer',libraries:'Bibliotecas',all:'Todos',res:'bibliotecas',c1:'Bibliotecas por territorio',c2:'Municipios con más sucursales',c3:'Servicios prestados por territorio (miles)',example:'Datos de ejemplo',phone:'Teléfono',footer:'Prototipo ilustrativo - Next Gen Academy S.L. (77 Delta)',src:'Fuente: listado RLPE del pliego (PCAP). Ubicación aproximada por municipio.',ser:'Servicios (miles)',n:'Bibliotecas',none:'Sin resultados',terr:{Álava:'Álava',Bizkaia:'Bizkaia',Gipuzkoa:'Gipuzkoa'}},
 eu:{title:'Irakurketa Publikoaren Mapa',sub:'Euskadiko Irakurketa Publikoaren Sarea (EIPS) · L-177411',territory:'Lurraldea',municipality:'Udalerria',search:'Bilatu liburutegia',reset:'Berrezarri',libraries:'Liburutegiak',all:'Guztiak',res:'liburutegi',c1:'Liburutegiak lurraldeka',c2:'Sukurtsal gehien dituzten udalerriak',c3:'Lurraldeko zerbitzuak (milakoak)',example:'Adibide-datuak',phone:'Telefonoa',footer:'Prototipo ilustratiboa - Next Gen Academy S.L. (77 Delta)',src:'Iturria: pleguko EIPS zerrenda (PCAP). Kokapena udalerriaren arabera, gutxi gorabehera.',ser:'Zerbitzuak (milakoak)',n:'Liburutegiak',none:'Emaitzarik ez',terr:{Álava:'Araba',Bizkaia:'Bizkaia',Gipuzkoa:'Gipuzkoa'}}
};
const D=JSON.parse(document.getElementById('inline-data').textContent);
const B=D.bibliotecas;
const EX={Álava:42,Bizkaia:118,Gipuzkoa:87}; // ejemplo / adibide
let lang=(location.hash.match(/lang=(eu|es)/)||[])[1]||'es';
const $=id=>document.getElementById(id);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const map=L.map('map').setView([43.0,-2.6],8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
const COL={Álava:'#0b6b3a',Bizkaia:'#c8202f',Gipuzkoa:'#1b5fa8'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let charts={},markers=new Map();
function filtered(){
 const t=$('fT').value,m=$('fM').value,q=norm($('fQ').value.trim());
 return B.filter(b=>(!t||b.provincia===t)&&(!m||b.municipio===m)&&(!q||norm(b.nombre+' '+b.municipio+' '+b.direccion).includes(q)));
}
function fillTerr(){const s=$('fT'),v=s.value;s.innerHTML='<option value="">'+I[lang].all+'</option>'+Object.keys(COL).map(t=>`<option value="${t}">${I[lang].terr[t]}</option>`).join('');s.value=v}
function fillMun(){const s=$('fM'),t=$('fT').value,v=s.value;
 const ms=[...new Set(B.filter(b=>!t||b.provincia===t).map(b=>b.municipio))].sort((a,b)=>a.localeCompare(b,'es'));
 s.innerHTML='<option value="">'+I[lang].all+'</option>'+ms.map(m=>`<option>${esc(m)}</option>`).join('');s.value=ms.includes(v)?v:''}
function popup(b){return `<b>${esc(b.nombre)}</b><br>${esc(b.direccion)}<br>${esc(b.cp)} ${esc(b.municipio)} (${I[lang].terr[b.provincia]})<br>${I[lang].phone}: ${esc(b.telefono||'-')}`}
function render(){
 const t=I[lang],r=filtered();
 $('count').textContent=r.length+' '+t.res+(r.length===1&&lang==='es'?'':'');
 $('count').textContent=lang==='es'?r.length+' bibliotecas':r.length+' liburutegi';
 layer.clearLayers();markers.clear();
 r.forEach(b=>{const mk=L.circleMarker([b.lat,b.lon],{radius:7,color:'#fff',weight:1.5,fillColor:COL[b.provincia],fillOpacity:.9}).bindPopup(()=>popup(b));mk.addTo(layer);markers.set(b,mk)});
 if(r.length){const g=L.latLngBounds(r.map(b=>[b.lat,b.lon]));map.fitBounds(g,{padding:[30,30],maxZoom:14})}
 $('list').innerHTML=r.length?r.slice(0,300).map((b,i)=>`<li data-i="${i}"><b>${esc(b.nombre)}</b><span>${esc(b.direccion)} · ${esc(b.municipio)}</span></li>`).join(''):`<li>${t.none}</li>`;
 [...$('list').querySelectorAll('li[data-i]')].forEach(li=>li.onclick=()=>{const b=r[+li.dataset.i];map.setView([b.lat,b.lon],15);markers.get(b).openPopup()});
 charts_(r);
}
function charts_(r){
 const t=I[lang],terrs=Object.keys(COL);
 const per=terrs.map(x=>r.filter(b=>b.provincia===x).length);
 const cnt={};r.forEach(b=>cnt[b.municipio]=(cnt[b.municipio]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,8);
 const cfg=(id,type,labels,data,label,colors)=>{
  if(charts[id]){const c=charts[id];c.config.type;c.data.labels=labels;c.data.datasets[0].data=data;c.data.datasets[0].label=label;c.data.datasets[0].backgroundColor=colors;c.update();return}
  charts[id]=new Chart($(id),{type,data:{labels,datasets:[{label,data,backgroundColor:colors}]},options:{maintainAspectRatio:false,indexAxis:id==='ch2'?'y':'x',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{beginAtZero:true,ticks:{precision:0}}}}});
 };
 cfg('ch1','bar',terrs.map(x=>t.terr[x]),per,t.n,terrs.map(x=>COL[x]));
 cfg('ch2','bar',top.map(x=>x[0]),top.map(x=>x[1]),t.n,'#0b6b3a');
 const sel=terrs.filter(x=>per[terrs.indexOf(x)]>0);
 cfg('ch3','bar',sel.map(x=>t.terr[x]),sel.map(x=>EX[x]),t.ser,sel.map(x=>COL[x]));
}
function setLang(l){lang=l;document.documentElement.lang=l;
 document.querySelectorAll('[data-i]').forEach(e=>{if(I[l][e.dataset.i]!==undefined&&e.tagName!=='LI')e.textContent=I[l][e.dataset.i]});
 $('fQ').placeholder=I[l].search;$('l-eu').classList.toggle('on',l==='eu');$('l-es').classList.toggle('on',l==='es');
 document.title=I[l].title+' · '+I[l==='es'?'eu':'es'].title;
 fillTerr();fillMun();render();}
$('fT').onchange=()=>{fillMun();render()};$('fM').onchange=render;$('fQ').oninput=render;
$('reset').onclick=()=>{$('fT').value='';fillMun();$('fM').value='';$('fQ').value='';render()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
setLang(lang);
</script>

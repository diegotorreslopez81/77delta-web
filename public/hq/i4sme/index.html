<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Licitaciones I4SME</title>
<link rel="stylesheet" href="/hq/app/tokens.css">
<link rel="stylesheet" href="/hq/app/hq.css">
<link rel="stylesheet" href="/hq/app/cards.css">
<style>
body { margin:0; background:var(--bg, #f6f7f9); }
main.vista { max-width:1280px; margin:0 auto; padding:16px; }
.socio-cab { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 16px; max-width:1280px; margin:0 auto; padding:16px 16px 0; }
.socio-cab h1 { font-size:20px; margin:0; }
</style>
</head>
<body>
<header class="socio-cab"><h1>Licitaciones I4SME</h1><span class="mu">Solo lectura</span></header>
<main id="vista" class="vista"><p class="cargando">Cargando...</p></main>
<script>
// El token del enlace se guarda con clave propia y se borra de la URL ANTES de cargar los módulos de HQ:
// api.js consume ?t=/#t= como token de HQ, y el del socio no debe pasar por ahí.
(function () {
  var q = new URLSearchParams(location.search).get('t') || new URLSearchParams(location.hash.replace(/^#/, '').split('?')[0]).get('t') || '';
  q = q.replace(/[^0-9a-zA-Z]/g, '');
  try { if (q) sessionStorage.setItem('hq_socio_t', q); } catch (e) { window.__socioT = q; }
  if (q) { window.__socioT = q; history.replaceState(null, '', location.pathname + '#operacion/licitaciones'); }
})();
</script>
<script type="module">
import { render, usarSocio } from '/hq/app/vistas/licitaciones.js';
const API = 'https://api.77delta.com';
const raiz = document.getElementById('vista');
let TOKEN = window.__socioT || '';
try { TOKEN = TOKEN || sessionStorage.getItem('hq_socio_t') || ''; } catch (e) { /* sin sessionStorage */ }
const aviso = t => { raiz.innerHTML = ''; const p = document.createElement('p'); p.className = 'cargando'; p.textContent = t; raiz.append(p); };
let cfgP;
const rpc = async (nombre, cuerpo) => {
  cfgP = cfgP || fetch(API + '/hq/config').then(r => r.json());
  const cfg = await cfgP;
  const r = await fetch(cfg.url + '/rest/v1/rpc/' + nombre, {
    method: 'POST',
    headers: { apikey: cfg.anon, Authorization: 'Bearer ' + cfg.anon, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: TOKEN, ...cuerpo }),
  });
  if (r.status === 403 || r.status === 401 || r.status === 400) { const e = new Error('token'); e.token = true; throw e; }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
};
function pintar() {
  const [camino, q = ''] = location.hash.replace(/^#/, '').split('?');
  const seg = camino.split('/').filter(Boolean);
  if (seg[0] !== 'operacion' || seg[1] !== 'licitaciones') { history.replaceState(null, '', location.pathname + '#operacion/licitaciones'); return pintar(); }
  raiz.innerHTML = ''; raiz.className = 'vista vista-operacion-licitaciones';
  render(raiz, { datos: { rol: 'socio' } }, seg[2], Object.fromEntries(new URLSearchParams(q)));
}
if (!TOKEN) aviso('Falta el token en el enlace.');
else if (TOKEN.length !== 64) aviso('Enlace incompleto: se ha cortado al copiarlo. Pide el enlace de nuevo y cópialo entero.');
else {
  usarSocio({ tabla: f => rpc('lic_socio_tabla', { p_filtro: f || {} }), historia: id => rpc('lic_socio_historia', { p_id: Number(id) }) });
  window.addEventListener('hashchange', pintar);
  pintar();
}
</script>
</body>
</html>
